# Publishes the image when a GitHub release is published. The release tag
# must be v<VERSION>; the image is pushed as ghcr.io/<owner>/hemaclone:<VERSION>.
# On a machine, pull it and give it the local name the launcher expects:
#   docker pull ghcr.io/kevindelgaudio/hemaclone:<VERSION>
#   docker tag ghcr.io/kevindelgaudio/hemaclone:<VERSION> hemaclone:<VERSION>

name: Release image

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Check that the tag matches VERSION
        id: version
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          tag="${{ github.event.release.tag_name }}"
          if [[ "$tag" != "v${version}" ]]; then
              echo "ERROR: release tag ${tag} does not match VERSION ${version} (expected v${version})" >&2
              exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/hemaclone:${version}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: workflow/docker/Dockerfile
          tags: ${{ steps.version.outputs.image }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
