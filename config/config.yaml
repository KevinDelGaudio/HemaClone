# =============================================================================
# HemaClone configuration: defaults for every setting.
#
# Change values for one run from the launch command:
#   bash workflow/hemaclone.sh run --cores 32 --mem-gb 96 --batch-size 1 \
#       --resources-dir /data/hg38_resources --tmpdir /scratch/tmp \
#       --set ch_filter.min_vaf=0.01
# or keep site-specific values in a separate YAML file with the same keys
# (e.g. config/local.yaml, not shared) and pass it with --settings.
#
# Precedence: this file < --settings file < --set < dedicated flags.
# Relative paths are relative to the project root, where the workflow is launched.
# =============================================================================

samples: "config/samples.tsv"

# FASTQ folder (flag: --fastq-dir). The sample sheet is built from it when the
# sheet does not exist yet, or with --rebuild-sheet; an existing sheet is used
# as it is, with a warning for FASTQ files it does not list.
fastq_dir: "fastq"

# Machine limits for a run (flags: --cores, --mem-gb).
# With Docker, cores and mem_gb are hard limits on the container: it can never
# use more. Jobs are scheduled into schedule_fraction of mem_gb, leaving
# headroom for Java overhead below the hard limit.
machine:
  cores: 16
  mem_gb: 64
  schedule_fraction: 0.9

# Samples processed per batch (flag: --batch-size).
# Each batch runs to completion before the next starts.
batch_size: 1

# Sequencing design (flag: --data-type): "wes" or "wgs". WGS fits BQSR on
# reference.wgs_intervals, writes the recalibrated BAM for the gene panel and
# the contamination sites only, deletes the duplicate-marked BAM once QC and
# BQSR are done, and uses CollectWgsMetrics with qc.thresholds_wgs. A WGS run
# must set ch_filter.min_dp and ch_filter.min_vaf explicitly at launch.
data_type: "wes"

# Scratch space for sorting and Java temp files (flag: --tmpdir)
tmpdir: "tmp"

# Reference resources (flag: --resources-dir sets reference.dir).
# File names are looked up inside dir; a value starting with / is used as is.
# Defaults are the GATK hg38 resource bundle names.
reference:
  dir: "resources"
  fasta: "Homo_sapiens_assembly38.fasta"
  exome_intervals: "exome_targets.hg38.interval_list"
  # WGS only: BQSR and coverage QC intervals (GATK WGS calling regions)
  wgs_intervals: "wgs_calling_regions.hg38.interval_list"
  gene_panel_bed: "chip_genes.bed"
  gnomad: "af-only-gnomad.hg38.vcf.gz"
  common_variants: "small_exac_common_3.hg38.vcf.gz"
  dbsnp: "Homo_sapiens_assembly38.dbsnp138.vcf"
  mills: "Mills_and_1000G_gold_standard.indels.hg38.vcf.gz"
  funcotator_ds: "funcotator_dataSources"
  # GIAB tandem repeats and homopolymers (bgzipped, tabix-indexed), for the
  # repeat-indel criterion
  repeats_bed: "GRCh38_AllTandemRepeatsandHomopolymers_slop5.bed.gz"

# A reference with ALT or fix-patch contigs (names ending in _alt or _fix) needs
# the ALT contig list <FASTA>.alt next to the bwa-mem2 index: without it, reads
# in regions those contigs duplicate get mapping quality 0 and are dropped
# before calling. The run stops in that case unless this is true.
reference_checks:
  allow_alt_without_index: false

# Building the resources folder (bash hemaclone.sh resources). Not used by runs.
resources:
  # GATK hg38 reference bundle and somatic resources
  bundle_url: "https://storage.googleapis.com/gcp-public-data--broad-references/hg38/v0"
  somatic_url: "https://storage.googleapis.com/gatk-best-practices/somatic-hg38"
  # GIAB genome stratifications (Dwarshuis et al. 2024), tandem repeats and
  # homopolymers, saved bgzipped and indexed under reference.repeats_bed
  repeats_url: "https://ftp-trace.ncbi.nlm.nih.gov/ReferenceSamples/giab/release/genome-stratifications/v3.3/GRCh38@all/LowComplexity/GRCh38_AllTandemRepeatsandHomopolymers_slop5.bed.gz"
  # Exome kit target BED, hg38 with chr names (flag: --targets)
  targets: null
  # CH gene panel: gene spans from the Funcotator GENCODE annotation,
  # intersected with the kit targets, each piece padded by panel_padding bp
  panel_padding: 50
  panel_genes: [
    ASXL1, ASXL2, BCOR, BCORL1, BRAF, BRCC3, CBL, CBLB, CEBPA, CHEK2, CREBBP, CTCF, CUX1,
    DNMT3A, EED, EP300, ETNK1, ETV6, EZH2, FLT3, GATA1, GATA2, GATA3, GNA13, GNAS, GNB1,
    IDH1, IDH2, IKZF1, IKZF2, IKZF3, IL18, IL1A, IL1B, IL33, JAK1, JAK2, JAK3, KDM6A, KIT,
    KMT2A, KMT2D, KRAS, LUC7L2, MPL, NF1, NLRP3, NPM1, NRAS, NXF1, P2RX7, PDS5B, PHF6,
    PHIP, PPM1D, PRPF8, PTEN, PTPN11, RAD21, RUNX1, SETBP1, SETD2, SETDB1, SF3B1, SMC1A,
    SMC3, SRCAP, SRSF2, STAG1, STAG2, SUZ12, TET2, TP53, U2AF1, U2AF2, UNK, WT1, YLPM1,
    ZBTB33, ZNF318, ZRSR2
  ]

tools:
  bwa: "bwa-mem2.avx2"
  # The run stops if `gatk --version` reports a different version. null = no check.
  gatk_version: "4.6.2.0"

# CH hard filters, applied per genotype (FORMAT/DP and FORMAT/AF)
ch_filter:
  min_dp: 100
  min_vaf: 0.02

# Panel of normals (bgzipped VCF with .tbi index), used by default.
# A bare file name is looked up inside the resources folder (reference.dir,
# flag --resources-dir); a value starting with / is used as is.
# Default: the GATK hg38 bundle panel built from 1000 Genomes samples.
# Do not use a panel built from the cohort being analysed: recurrent CHIP
# hotspots (e.g. DNMT3A R882, JAK2 V617F) would be treated as artifacts.
#   mode: annotate -> calls are kept; sites in the panel get an INFO/PON flag
#   mode: filter   -> panel passed to Mutect2; sites in it fail FILTER
# Turn it off for one run with: --set pon.vcf=null
pon:
  vcf: "1000g_pon.hg38.vcf.gz"
  mode: "annotate"

# CHIP classification of the ch_final calls. Depth and VAF floors are the
# ch_filter values above. A call qualifies when every criterion passes:
#   - Variant_Classification in variant_classes (protein-altering)
#   - at least min_alt_reads alternate reads
#   - depth >= ch_filter.min_dp and VAF >= ch_filter.min_vaf (re-checked on MAF counts)
#   - VAF <= max_vaf: heterozygous germline sits near 0.5 and cannot be
#     separated from a very large clone without a matched normal
#   - one-sided binomial test of VAF below 0.5 with p < max_binom_p
#   - gnomAD AF <= max_gnomad_af, from reference.gnomad matched by allele
#     (absent from gnomAD = 0)
#   - when a PoN is used: not in the PoN, unless at a hotspot in pon_exempt_hotspots
# A sample is CHIP+ with at least one qualifying call in a gene not listed in
# status_exclude_genes. Calls in excluded genes are reported, not counted.
chip:
  max_vaf: 0.35
  max_binom_p: 0.01
  min_alt_reads: 3
  max_gnomad_af: 0.01
  large_clone_vaf: 0.10
  # Strand bias: strand odds ratio from FORMAT/SB (GATK formula, +1 per count)
  max_sor: 3
  # Indels: thresholds on top of ch_filter.min_vaf and min_alt_reads; can only
  # be stricter (the defaults change nothing)
  indel_min_vaf: 0.02
  indel_min_alt_reads: 3
  # Indels in a tandem repeat or homopolymer (Mutect2 INFO/STR or the GIAB
  # repeats BED): stricter thresholds instead of exclusion
  repeat_indel_min_vaf: 0.05
  repeat_indel_min_alt_reads: 5
  variant_classes:
    - Missense_Mutation
    - Nonsense_Mutation
    - Nonstop_Mutation
    - Frame_Shift_Del
    - Frame_Shift_Ins
    - In_Frame_Del
    - In_Frame_Ins
    - Splice_Site
    - Translation_Start_Site
  # Panel genes called and reported but not counted for CHIP status
  status_exclude_genes: [IL1A, IL1B, IL18, IL33, NLRP3, P2RX7]
  # GENE:protein-change prefix; a PoN-flagged call matching one is kept
  pon_exempt_hotspots:
    - "DNMT3A:p.R882"
    - "JAK2:p.V617F"
    - "SF3B1:p.K700"
    - "SF3B1:p.K666"
    - "SRSF2:p.P95"
    - "U2AF1:p.S34"
    - "U2AF1:p.Q157"
    - "IDH1:p.R132"
    - "IDH2:p.R140"
    - "IDH2:p.R172"
    - "GNB1:p.K57"
    - "KRAS:p.G12"
    - "KRAS:p.G13"
    - "KRAS:p.Q61"
    - "NRAS:p.G12"
    - "NRAS:p.G13"
    - "NRAS:p.Q61"

qc:
  # Conda env holding fastqc and multiqc; null = take them from PATH
  # (null is correct inside the Docker image).
  conda_env: null
  # Relative to the workflow home (the copy inside the image), not the project
  multiqc_config: "config/multiqc_config.yaml"
  thresholds:
    min_mean_coverage: 30
    min_pct_target_20x: 0.80
    min_pct_selected: 0.40
    max_pct_dupe: 0.50
    max_dropout: 10.0
  # data_type wgs: CollectWgsMetrics over reference.wgs_intervals
  thresholds_wgs:
    min_mean_coverage: 25
    min_pct_20x: 0.80
    max_pct_dupe: 0.30

# Tool parameters. "extra" is appended verbatim to the command line.
tool_params:
  bwa_map:
    sort_mem_per_thread: "3G"
    extra: ""
  markdup:
    extra: ""
  base_recalibrator:
    extra: ""
  apply_bqsr:
    extra: ""
    # data_type wgs: bases added around the panel and contamination sites, so
    # Mutect2 has the reads around its active regions
    wgs_padding: 150
  mutect2:
    extra: ""
  filter_mutect:
    extra: ""
  funcotator:
    ref_version: "hg38"
    extra: ""
  hs_metrics:
    coverage_cap: 1000
    min_mapq: 20
    min_baseq: 20
  insert_size:
    min_pct: 0.5
  wgs_metrics:
    coverage_cap: 250
    min_mapq: 20
    min_baseq: 20

# Fraction of a job's memory given to the Java heap (-Xmx)
java_heap_fraction: 0.85

# Size of each job: threads and memory (MB). Within a batch, Snakemake runs as
# many jobs at once as fit in the machine limits above.
# Per-run override, e.g.: --set job_sizes.mutect2.mem_mb=20000
job_sizes:
  fastq_check:             {threads: 3, mem_mb: 1000}
  bwa_map:                 {threads: 8, mem_mb: 45000}
  markdup:                 {threads: 2, mem_mb: 16000}
  base_recalibrator:       {threads: 2, mem_mb: 12000}
  apply_bqsr:              {threads: 2, mem_mb: 12000}
  mutect2:                 {threads: 8, mem_mb: 12000}
  learn_orientation:       {threads: 1, mem_mb: 4000}
  pileup_summaries:        {threads: 1, mem_mb: 4000}
  calculate_contamination: {threads: 1, mem_mb: 4000}
  filter_mutect:           {threads: 1, mem_mb: 4000}
  pon_annotate:            {threads: 1, mem_mb: 2000}
  select_pass:             {threads: 1, mem_mb: 4000}
  ch_flag:                 {threads: 1, mem_mb: 4000}
  ch_select:               {threads: 1, mem_mb: 4000}
  gnomad_annotate:         {threads: 1, mem_mb: 1000}
  funcotator:              {threads: 1, mem_mb: 12000}
  fastqc:                  {threads: 1, mem_mb: 2000}
  samtools_qc:             {threads: 2, mem_mb: 2000}
  alignment_summary:       {threads: 1, mem_mb: 8000}
  insert_size:             {threads: 1, mem_mb: 8000}
  hs_metrics:              {threads: 1, mem_mb: 8000}
  wgs_metrics:             {threads: 1, mem_mb: 8000}
  multiqc:                 {threads: 1, mem_mb: 8000}
  qc_flags:                {threads: 1, mem_mb: 1000}
  chip_sample:             {threads: 1, mem_mb: 2000}
  chip_cohort:             {threads: 1, mem_mb: 4000}
