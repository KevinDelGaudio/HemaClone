# R and the packages the reports need, in their own environment so the main
# tools layer is unchanged. Every package is pinned; tools.rscript in
# config.yaml points to this environment.
name: report
channels:
  - conda-forge
  - bioconda
dependencies:
  - r-base=4.5.1
  - bioconductor-maftools=2.26.0
  - r-rmarkdown=2.29
  - r-knitr=1.50
  - pandoc=3.6.4
  - r-dplyr=1.1.4
  - r-tidyr=1.3.1
  - r-ggplot2=3.5.2
  - r-yaml=2.3.10
